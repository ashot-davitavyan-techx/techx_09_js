<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link rel="stylesheet" href="css/style.css" />
		<title>Document</title>
	</head>
	<body>
		<header>
			<h1>User Profile</h1>
		</header>
		<main>
			<form id="form">
				<div class="form-container">
					<div class="user-info" id="user-info">
						<input
							class="styled-input"
							type="text"
							name="full-name"
							id="full-name"
							placeholder="Full Name"
							required
						/>
						<input
							class="styled-input"
							type="email"
							name="email"
							id="email"
							placeholder="Email"
							required
						/>
					</div>
					<div class="submit-box">
						<button type="submit" class="styled-button">
							Submit
						</button>
					</div>
				</div>
			</form>
		</main>
	</body>
	<script type="module" src="js/main.js"></script>
</html>
